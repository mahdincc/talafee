name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  crawler-service:
    name: Build & test crawler-service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crawler-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: crawler-service/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
