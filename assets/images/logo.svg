<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="50%" style="stop-color:#D97706"/>
      <stop offset="100%" style="stop-color:#B45309"/>
    </linearGradient>
    <linearGradient id="goldGradientLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FCD34D"/>
      <stop offset="100%" style="stop-color:#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- Icon: Gold bar/ingot shape -->
  <g transform="translate(5, 8)">
    <!-- Main gold bar -->
    <path d="M5 28 L12 8 L28 8 L35 28 Z" fill="url(#goldGradient)" stroke="#92400E" stroke-width="1"/>
    <!-- Top face -->
    <path d="M12 8 L28 8 L25 12 L15 12 Z" fill="url(#goldGradientLight)"/>
    <!-- Shine -->
    <path d="M14 14 L22 14 L21 18 L15 18 Z" fill="rgba(255,255,255,0.3)"/>
  </g>

  <!-- Text: Talafee -->
  <text x="50" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="url(#goldGradient)">
    Talafee
  </text>

  <!-- Persian text -->
  <text x="145" y="35" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#78716C" text-anchor="start">
    طلافی
  </text>
</svg>
