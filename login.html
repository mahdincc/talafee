<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talafee | Login</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --color-background: #FAFAFA;
      --color-surface: #FFFFFF;
      --color-text-primary: #1A1A1A;
      --color-text-secondary: #6B7280;
      --color-text-tertiary: #9CA3AF;
      --color-border: #E5E7EB;
      --color-gold-50: #FDF8E8;
      --color-gold-100: #F9EDCC;
      --color-gold-200: #F0D98C;
      --color-gold-400: #D4AF37;
      --color-gold-500: #C5A028;
      --color-gold-600: #A68523;
      --color-gold-700: #8B6914;
      --color-success: #10B981;
      --color-danger: #EF4444;
      --font-display: 'Outfit', 'Vazirmatn', system-ui, sans-serif;
      --font-persian: 'Vazirmatn', 'Tahoma', sans-serif;
      --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px;
      --space-5: 20px; --space-6: 24px; --space-8: 32px;
      --radius-md: 8px; --radius-lg: 12px; --radius-xl: 16px;
      --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    body {
      font-family: var(--font-persian);
      background: linear-gradient(135deg, var(--color-gold-50) 0%, var(--color-background) 50%, var(--color-gold-50) 100%);
      color: var(--color-text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-4);
    }

    .login-container {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      padding: var(--space-8);
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--color-border);
    }

    .login-header {
      text-align: center;
      margin-bottom: var(--space-8);
    }

    .logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-3);
      margin-bottom: var(--space-4);
    }

    .logo-icon {
      width: 48px;
      height: 48px;
      background: linear-gradient(135deg, var(--color-gold-400), var(--color-gold-600));
      border-radius: var(--radius-lg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
    }

    .logo-text {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
    }

    .logo-text span {
      color: var(--color-gold-400);
    }

    .login-title {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: var(--space-1);
    }

    .login-subtitle {
      color: var(--color-text-secondary);
      font-size: 0.875rem;
    }

    .tabs {
      display: flex;
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      margin-bottom: var(--space-6);
      overflow: hidden;
    }

    .tab {
      flex: 1;
      padding: var(--space-3);
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--color-text-secondary);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab.active {
      background: var(--color-gold-400);
      color: white;
    }

    .tab:not(.active):hover {
      background: var(--color-gold-50);
    }

    .form-group {
      margin-bottom: var(--space-4);
    }

    .form-label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: var(--space-2);
    }

    .form-input {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--color-gold-400);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
    }

    .form-input::placeholder {
      color: var(--color-text-tertiary);
    }

    .input-group {
      position: relative;
    }

    .input-icon {
      position: absolute;
      right: var(--space-3);
      top: 50%;
      transform: translateY(-50%);
      color: var(--color-text-tertiary);
    }

    [dir="ltr"] .input-icon {
      right: auto;
      left: var(--space-3);
    }

    .input-group .form-input {
      padding-right: 40px;
    }

    [dir="ltr"] .input-group .form-input {
      padding-right: var(--space-4);
      padding-left: 40px;
    }

    .password-toggle {
      position: absolute;
      left: var(--space-3);
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--color-text-tertiary);
      padding: 0;
    }

    [dir="ltr"] .password-toggle {
      left: auto;
      right: var(--space-3);
    }

    .form-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-5);
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      font-size: 0.875rem;
      cursor: pointer;
    }

    .checkbox-label input {
      width: 16px;
      height: 16px;
      accent-color: var(--color-gold-400);
    }

    .forgot-link {
      font-size: 0.875rem;
      color: var(--color-gold-600);
      text-decoration: none;
    }

    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-primary {
      width: 100%;
      padding: var(--space-3) var(--space-4);
      background: linear-gradient(135deg, var(--color-gold-400), var(--color-gold-500));
      border: none;
      border-radius: var(--radius-md);
      color: white;
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, var(--color-gold-500), var(--color-gold-600));
      box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: var(--space-4);
      margin: var(--space-6) 0;
      color: var(--color-text-tertiary);
      font-size: 0.75rem;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--color-border);
    }

    .social-buttons {
      display: flex;
      gap: var(--space-3);
    }

    .btn-social {
      flex: 1;
      padding: var(--space-3);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      background: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      font-size: 0.875rem;
      color: var(--color-text-secondary);
      transition: all 0.2s ease;
    }

    .btn-social:hover {
      border-color: var(--color-gold-200);
      background: var(--color-gold-50);
    }

    .form-section {
      display: none;
    }

    .form-section.active {
      display: block;
    }

    .login-footer {
      text-align: center;
      margin-top: var(--space-6);
      padding-top: var(--space-4);
      border-top: 1px solid var(--color-border);
    }

    .login-footer a {
      color: var(--color-gold-600);
      text-decoration: none;
    }

    .login-footer a:hover {
      text-decoration: underline;
    }

    .quick-links {
      display: flex;
      justify-content: center;
      gap: var(--space-4);
      margin-top: var(--space-4);
      font-size: 0.75rem;
    }

    .quick-links a {
      color: var(--color-text-secondary);
      text-decoration: none;
    }

    .quick-links a:hover {
      color: var(--color-gold-600);
    }

    .error-message {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      color: var(--color-danger);
      padding: var(--space-3);
      border-radius: var(--radius-md);
      font-size: 0.875rem;
      margin-bottom: var(--space-4);
      display: none;
    }

    .error-message.show {
      display: flex;
      align-items: center;
      gap: var(--space-2);
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <div class="logo-icon">
            <i data-lucide="coins" style="width: 24px; height: 24px;"></i>
          </div>
          <div class="logo-text"><span>Tala</span>fee</div>
        </div>
        <h1 class="login-title" id="formTitle" data-fa="ورود به حساب کاربری" data-en="Sign in to your account">ورود به حساب کاربری</h1>
        <p class="login-subtitle" data-fa="به پلتفرم مقایسه قیمت طلا خوش آمدید" data-en="Welcome to the gold price comparison platform">به پلتفرم مقایسه قیمت طلا خوش آمدید</p>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="showForm('login')" data-fa="ورود" data-en="Login">ورود</button>
        <button class="tab" onclick="showForm('register')" data-fa="ثبت‌نام" data-en="Register">ثبت‌نام</button>
      </div>

      <div class="error-message" id="errorMessage">
        <i data-lucide="alert-circle" style="width: 16px; height: 16px;"></i>
        <span id="errorText"></span>
      </div>

      <!-- Login Form -->
      <form class="form-section active" id="loginForm">
        <div class="form-group">
          <label class="form-label" data-fa="ایمیل یا شماره موبایل" data-en="Email or Phone">ایمیل یا شماره موبایل</label>
          <div class="input-group">
            <i data-lucide="user" class="input-icon" style="width: 18px; height: 18px;"></i>
            <input type="text" class="form-input" placeholder="example@email.com" dir="ltr">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" data-fa="رمز عبور" data-en="Password">رمز عبور</label>
          <div class="input-group">
            <i data-lucide="lock" class="input-icon" style="width: 18px; height: 18px;"></i>
            <input type="password" class="form-input" id="loginPassword" placeholder="••••••••">
            <button type="button" class="password-toggle" onclick="togglePassword('loginPassword')">
              <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
        </div>

        <div class="form-row">
          <label class="checkbox-label">
            <input type="checkbox" checked>
            <span data-fa="مرا به خاطر بسپار" data-en="Remember me">مرا به خاطر بسپار</span>
          </label>
          <a href="#" class="forgot-link" data-fa="فراموشی رمز عبور" data-en="Forgot password?">فراموشی رمز عبور</a>
        </div>

        <button type="submit" class="btn-primary" onclick="handleLogin(event)">
          <i data-lucide="log-in" style="width: 18px; height: 18px;"></i>
          <span data-fa="ورود به حساب" data-en="Sign In">ورود به حساب</span>
        </button>
      </form>

      <!-- Register Form -->
      <form class="form-section" id="registerForm">
        <div class="form-group">
          <label class="form-label" data-fa="نام و نام خانوادگی" data-en="Full Name">نام و نام خانوادگی</label>
          <div class="input-group">
            <i data-lucide="user" class="input-icon" style="width: 18px; height: 18px;"></i>
            <input type="text" class="form-input" placeholder="علی قاسمی">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" data-fa="ایمیل" data-en="Email">ایمیل</label>
          <div class="input-group">
            <i data-lucide="mail" class="input-icon" style="width: 18px; height: 18px;"></i>
            <input type="email" class="form-input" placeholder="example@email.com" dir="ltr">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" data-fa="شماره موبایل" data-en="Phone Number">شماره موبایل</label>
          <div class="input-group">
            <i data-lucide="phone" class="input-icon" style="width: 18px; height: 18px;"></i>
            <input type="tel" class="form-input" placeholder="09123456789" dir="ltr">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" data-fa="رمز عبور" data-en="Password">رمز عبور</label>
          <div class="input-group">
            <i data-lucide="lock" class="input-icon" style="width: 18px; height: 18px;"></i>
            <input type="password" class="form-input" id="registerPassword" placeholder="••••••••">
            <button type="button" class="password-toggle" onclick="togglePassword('registerPassword')">
              <i data-lucide="eye" style="width: 18px; height: 18px;"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox">
            <span data-fa="با قوانین و مقررات موافقم" data-en="I agree to the terms and conditions">با قوانین و مقررات موافقم</span>
          </label>
        </div>

        <button type="submit" class="btn-primary" onclick="handleRegister(event)">
          <i data-lucide="user-plus" style="width: 18px; height: 18px;"></i>
          <span data-fa="ایجاد حساب کاربری" data-en="Create Account">ایجاد حساب کاربری</span>
        </button>
      </form>

      <div class="divider" data-fa="یا" data-en="or">یا</div>

      <div class="social-buttons">
        <button type="button" class="btn-social">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button type="button" class="btn-social">
          <i data-lucide="smartphone" style="width: 18px; height: 18px;"></i>
          <span data-fa="پیامک" data-en="SMS">پیامک</span>
        </button>
      </div>

      <div class="login-footer">
        <p style="font-size: 0.875rem; color: var(--color-text-secondary);">
          <a href="index.html" data-fa="بازگشت به صفحه اصلی" data-en="Back to home page">بازگشت به صفحه اصلی</a>
        </p>
        <div class="quick-links">
          <a href="user-panel.html" data-fa="پنل کاربری (دمو)" data-en="User Panel (Demo)">پنل کاربری (دمو)</a>
          <span>|</span>
          <a href="admin-panel.html" data-fa="پنل مدیریت (دمو)" data-en="Admin Panel (Demo)">پنل مدیریت (دمو)</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();

    function showForm(type) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form-section').forEach(f => f.classList.remove('active'));

      if (type === 'login') {
        document.querySelectorAll('.tab')[0].classList.add('active');
        document.getElementById('loginForm').classList.add('active');
        document.getElementById('formTitle').textContent = 'ورود به حساب کاربری';
      } else {
        document.querySelectorAll('.tab')[1].classList.add('active');
        document.getElementById('registerForm').classList.add('active');
        document.getElementById('formTitle').textContent = 'ایجاد حساب کاربری';
      }

      document.getElementById('errorMessage').classList.remove('show');
    }

    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function handleLogin(e) {
      e.preventDefault();
      // Demo: redirect to user panel
      window.location.href = 'user-panel.html';
    }

    function handleRegister(e) {
      e.preventDefault();
      // Demo: redirect to user panel
      window.location.href = 'user-panel.html';
    }
  </script>
</body>
</html>
